<!doctype html><html><head><meta charset="utf-8"><title>Activity Monitor settings</title><style>body{font:16px system-ui;max-width:620px;margin:40px auto;padding:0 16px}label{display:block;margin:16px 0}h1{margin-top:0}textarea{width:100%;min-height:100px;margin:8px 0;padding:8px;border:1px solid #ccc;border-radius:4px}button{padding:8px 14px;margin-right:8px;background:#3b82f6;color:white;border:none;border-radius:4px;cursor:button}button:hover{background:#2563eb}button.cancel{background:#6b7280}#status{margin:16px 0;padding:8px;border-radius:4px;font-size:14px}#status.saved{background:#d1e7dd;color:#0f5132}#status.error{background:#fecaca;color:#991b1b}</style></head><body><h1>Local Activity Monitor</h1><div class="flex items-center gap-2 mb-4"><input id="paused" type="checkbox" aria-label="Pause browser tracking"/><label for="paused" class="text-slate-300">Pause browser tracking</label></div><label class="mt-4"><span class="block text-sm text-slate-500 mb-1">Excluded domains (one per line, example: example.com)</span><textarea id="excluded" placeholder="example.com\nanalytics.com" rows="3"></textarea></label><div class="mt-4 flex gap-2"><button id="save" class="flex-1">Save settings</button><button id="cancel" class="cancel">Cancel</button></div><p id="status" role="status"></p><p class="mt-6 text-xs text-slate-500">Changes take effect immediately. Domain exclusions use suffix matching (e.g., "example.com" excludes "sub.example.com").</p><script src="options.js"></script></body></html>
